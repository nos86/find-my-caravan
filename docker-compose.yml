version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fmc_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fmc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fmc_secret}
      POSTGRES_DB: ${POSTGRES_DB:-findmycaravan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fmc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fmc_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fmc_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fmc}:${POSTGRES_PASSWORD:-fmc_secret}@postgres:5432/${POSTGRES_DB:-findmycaravan}
      REDIS_URL: redis://redis:6379/0
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fmc_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
